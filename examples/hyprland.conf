# wine-sni-bridge window rules for Hyprland
#
# The bridge creates a small X11 utility window for XEmbed compositing.
# These rules make it completely invisible to the user.

# Wine SNI Bridge container - hide it
windowrulev2 = float, class:wine-sni-bridge
windowrulev2 = nofocus, class:wine-sni-bridge
windowrulev2 = opacity 0.0 override 0.0 override, class:wine-sni-bridge
windowrulev2 = noborder, class:wine-sni-bridge
windowrulev2 = noshadow, class:wine-sni-bridge
windowrulev2 = noblur, class:wine-sni-bridge
windowrulev2 = noanimations, class:wine-sni-bridge

# Optional: prevent Wine tray helper windows from stealing focus
windowrulev2 = nofocus, class:^(wine|Wine|explorer\.exe)$
windowrulev2 = float, class:^(wine|Wine)$
