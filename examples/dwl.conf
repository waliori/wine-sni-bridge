# wine-sni-bridge window rules for dwl-based compositors (MangoWC, dwl, etc.)
#
# The bridge creates a small X11 utility window for XEmbed compositing.
# These rules make it completely invisible to the user.

# Wine SNI Bridge container - hide it
windowrule=nofocus:1,appid:wine-sni-bridge
windowrule=isfloating:1,appid:wine-sni-bridge
windowrule=isoverlay:1,appid:wine-sni-bridge
windowrule=focused_opacity:0.0,appid:wine-sni-bridge
windowrule=unfocused_opacity:0.0,appid:wine-sni-bridge
windowrule=isnoborder:1,appid:wine-sni-bridge
windowrule=isnoshadow:1,appid:wine-sni-bridge
windowrule=isnoanimation:1,appid:wine-sni-bridge
windowrule=noblur:1,appid:wine-sni-bridge

# Optional: prevent Wine tray helper windows from stealing focus
windowrule=nofocus:1,title:wine
windowrule=nofocus:1,title:Wine
windowrule=nofocus:1,appid:Wine
windowrule=nofocus:1,appid:wine
windowrule=nofocus:1,appid:explorer.exe
windowrule=isfloating:1,title:wine
windowrule=isfloating:1,title:Wine
windowrule=isfloating:1,appid:Wine
windowrule=isfloating:1,appid:wine
